<head>

<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useMemo } = React;

        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp, addDoc, deleteDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- ICONOS SVG ---
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Trophy = (props) => <Icon {...props} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 22V18"/><path d="M14 22V18"/><path d="M18 4H6v7a6 6 0 0 0 12 0V4Z"/></>} />;
        const LogOut = (props) => <Icon {...props} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>} />;
        const Cloud = (props) => <Icon {...props} path={<path d="M17.5 19a5.5 5.5 0 0 0 2.5-10.5 8.5 8.5 0 1 0-15.5 1.5A5.5 5.5 0 0 0 4.5 19Z"/>} />;
        const ChevronRight = (props) => <Icon {...props} path={<polyline points="9 18 15 12 9 6"/>} />;
        const ChevronLeft = (props) => <Icon {...props} path={<polyline points="15 18 9 12 15 6"/>} />;
        const ChevronDown = (props) => <Icon {...props} path={<polyline points="6 9 12 15 18 9"/>} />;
        const CheckCircle2 = (props) => <Icon {...props} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />;
        const MinusCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="8" x2="16" y1="12" y2="12"/></>} />;
        const UserPlus = (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="16" x2="22" y1="11" y2="11"/></>} />;
        const Plus = (props) => <Icon {...props} path={<><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>} />;
        const ClipboardList = (props) => <Icon {...props} path={<><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></>} />;
        const UploadCloud = (props) => <Icon {...props} path={<><path d="m16 13-4-4-4 4"/><path d="M12 9v9"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/><path d="M12 13v9"/></>} />;
        const Trash2 = (props) => <Icon {...props} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 2-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} />;
        const Users = (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />;
        const Search = (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></>} />;
        const BarChart3 = (props) => <Icon {...props} path={<><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>} />;
        const Mic = (props) => <Icon {...props} path={<><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></>} />;
        const Square = (props) => <Icon {...props} path={<rect width="18" height="18" x="3" y="3" rx="2"/>} />;
        const FileText = (props) => <Icon {...props} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></>} />;
        const Download = (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />;

        const firebaseConfig = {
          apiKey: "AIzaSyCLW7tZxGuecMGa7FgWuvGMcxi4x_5wD7w",
          authDomain: "north-champions-2026.firebaseapp.com",
          projectId: "north-champions-2026",
          storageBucket: "north-champions-2026.firebasestorage.app",
          messagingSenderId: "14904881173",
          appId: "1:14904881173:web:97937bc54d5d309155f81c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'north-champions-2026';
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbxDtQ_e9r_hyGHvT3v5T501qY48RzxSF-BH9RMsq2nu6HX0lMIso_0Eh1wFAgAecfn5/exec";

        const LOGO_URL = "NORTH-26-JUJUY_1.jpg";

        const CRITERIA = [
            { id: 'creatividad', label: '1. Creatividad', max: 2, section: 'Desempeño' },
            { id: 'escenario', label: '2. Escenario Espacio y Transiciones', max: 2, section: 'Desempeño' },
            { id: 'intensidad', label: '3. Intensidad Proyección y Presencia', max: 2, section: 'Desempeño' },
            { id: 'imagen', label: '4. Imagen Urbana', max: 2, section: 'Desempeño' },
            { id: 'entretenimiento', label: '5. Entretenimiento Atracción', max: 2, section: 'Desempeño' },
            { id: 'musicalidad', label: '6. Musicalidad', max: 2, section: 'Habilidades' },
            { id: 'sincronizacion', label: '7. Sincronización', max: 2, section: 'Habilidades' },
            { id: 'ejecucion', label: '8. Ejecución', max: 2, section: 'Habilidades' },
            { id: 'dificultad', label: '9. Dificultad Estilos Urbanos', max: 2, section: 'Habilidades' },
            { id: 'variedad', label: '10. Variedad de Estilo', max: 2, section: 'Habilidades' },
        ];

        const DEDUCTIONS_LIST = [
            { id: 'miembros_inicio', label: 'Miembros no en escenario al inicio', value: 1.00 },
            { id: 'caida_mayor', label: 'Caída grado mayor', value: 0.10 },
            { id: 'caida_menor', label: 'Caída grado menor', value: 0.05 },
            { id: 'reinicio', label: 'Reinicio de rutina', value: 1.00 },
            { id: 'fuera_tiempo', label: 'Duración fuera de tiempo', value: 1.00 },
            { id: 'lenguaje_inapropiado', label: 'Lenguaje inapropiado', value: 0.05 },
            { id: 'gestos_obscenos', label: 'Gestos obscenos', value: 0.10 },
            { id: 'vestimenta_inapropiada', label: 'Vestimenta inapropiada', value: 0.05 },
            { id: 'pinturas_confeti', label: 'Uso de pinturas/confeti', value: 1.00 },
            { id: 'accesorios_lanzados', label: 'Ropa/accesorios lanzados', value: 0.10 },
        ];

        const JURADOS = [
            { id: 'juez1', name: 'Jurado 1', pass: 'dance101' },
            { id: 'juez2', name: 'Jurado 2', pass: 'dance202' },
            { id: 'juez3', name: 'Jurado 3', pass: 'dance303' },
            { id: 'admin', name: 'Administrador', pass: 'master99' },
        ];

        const CATEGORIAS = [
            'Solista kids', 'Solista Juvenil', 'Pre Junior', 'Junior', 'Varsity', 'Adult', 'Mini Crew Kids', 'Mini Crew', 'Mega Kids', 'Mega Crew'
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [currentUserData, setCurrentUserData] = useState(null);
            const [password, setPassword] = useState('');
            const [view, setView] = useState('login'); 
            const [scores, setScores] = useState([]);
            const [participants, setParticipants] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selectedGroup, setSelectedGroup] = useState(null);
            const [formScores, setFormScores] = useState({}); 
            const [formDeductions, setFormDeductions] = useState({}); 
            const [message, setMessage] = useState(null);
            const [timerRemaining, setTimerRemaining] = useState(0);
            const [editingVote, setEditingVote] = useState(false);
            
            // Admin states
            const [searchTerm, setSearchTerm] = useState('');
            const [newParticipantName, setNewParticipantName] = useState('');
            const [newParticipantCount, setNewParticipantCount] = useState('1');
            const [bulkList, setBulkList] = useState('');
            const [currentCategory, setCurrentCategory] = useState(CATEGORIAS[0]);
            const [expandedCategories, setExpandedCategories] = useState({});
            const [selectedParticipantForPDF, setSelectedParticipantForPDF] = useState(null);
            const [showCleanupModal, setShowCleanupModal] = useState(false);
            const [cleanupCode, setCleanupCode] = useState('');
            const [isCleaning, setIsCleaning] = useState(false);

            // Audio recorder states
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [audioBase64, setAudioBase64] = useState(null);
            const [audioPreviewUrl, setAudioPreviewUrl] = useState(null);
            const [mediaRecorder, setMediaRecorder] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const MAX_RECORDING_TIME = 240;

            useEffect(() => {
                return () => {
                    if (audioPreviewUrl) {
                        URL.revokeObjectURL(audioPreviewUrl);
                    }
                };
            }, [audioPreviewUrl]);

            useEffect(() => {
                let timer;
                if (isRecording) {
                    timer = setInterval(() => {
                        setRecordingTime(prev => {
                            if (prev >= MAX_RECORDING_TIME - 1) {
                                stopRecording();
                                return MAX_RECORDING_TIME;
                            }
                            return prev + 1;
                        });
                    }, 1000);
                } else {
                    setRecordingTime(0);
                }
                return () => clearInterval(timer);
            }, [isRecording]);

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                    let mimeType = '';

                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        mimeType = 'audio/webm;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        mimeType = 'audio/webm';
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                    }

                    const recorder = mimeType
                        ? new MediaRecorder(stream, { mimeType })
                        : new MediaRecorder(stream);

                    const chunks = [];

                    recorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            chunks.push(e.data);
                        }
                    };

                    recorder.onstop = () => {
                        const finalMimeType =
                            recorder.mimeType ||
                            mimeType ||
                            'audio/webm';

                        const blob = new Blob(chunks, {
                            type: finalMimeType
                        });

                        // URL temporal para escuchar el audio recién grabado.
                        const previewUrl = URL.createObjectURL(blob);
                        setAudioPreviewUrl(previewUrl);

                        // Base64: se conserva para el envío a Google Drive.
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setAudioBase64(reader.result);
                        };
                        reader.readAsDataURL(blob);

                        stream.getTracks().forEach(track => track.stop());
                    };

                    recorder.start(1000);
                    setMediaRecorder(recorder);
                    setIsRecording(true);
                    setRecordingTime(0);

                } catch (err) {
                    console.error("Error al grabar:", err);
                    showMessage('Error al acceder al micrófono', 'error');
                }
            };

            const stopRecording = () => {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    setIsRecording(false);
                }
            };

            const discardAudio = () => {
                if (audioPreviewUrl) {
                    URL.revokeObjectURL(audioPreviewUrl);
                }

                setAudioPreviewUrl(null);
                setAudioBase64(null);
                setRecordingTime(0);
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth error:", err); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubScores = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'scores'), (snap) => {
                    setScores(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubParticipants = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'participants'), (snap) => {
                    setParticipants(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubScores(); unsubParticipants(); };
            }, [user]);

            useEffect(() => {
                let interval;
                if (timerRemaining > 0) {
                    interval = setInterval(() => setTimerRemaining(prev => prev - 1), 1000);
                } else if (timerRemaining === 0 && view === 'success') {
                    setView('categories');
                    setSelectedGroup(null);
                    setEditingVote(false);
                } else if (timerRemaining === 0 && editingVote) {
                    setEditingVote(false);
                    setView('groups');
                }
                return () => clearInterval(interval);
            }, [timerRemaining, view, editingVote]);

            const handleLogin = () => {
                const found = JURADOS.find(j => j.pass === password);
                if (found) {
                    setCurrentUserData(found);
                    setView(found.id === 'admin' ? 'admin' : 'categories');
                    setPassword('');
                    showMessage(`Bienvenido, ${found.name}`);
                } else { 
                    showMessage('Contraseña incorrecta', 'error'); 
                }
            };

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3000);
            };

            // Limpieza total protegida por un código independiente del acceso Master.
            // Borra participantes y calificaciones de Firestore.
            const MASTER_CLEANUP_CODE = 'LIMPIAR-2026';

            const cleanEntireApp = async () => {
                if (cleanupCode !== MASTER_CLEANUP_CODE) {
                    showMessage('Código de limpieza incorrecto', 'error');
                    return;
                }

                if (!user || currentUserData?.id !== 'admin' || isCleaning) return;

                setIsCleaning(true);
                try {
                    const participantsRef = collection(db, 'artifacts', appId, 'public', 'data', 'participants');
                    const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
                    const [participantsSnap, scoresSnap] = await Promise.all([
                        getDocs(participantsRef),
                        getDocs(scoresRef)
                    ]);

                    const docsToDelete = [
                        ...participantsSnap.docs,
                        ...scoresSnap.docs
                    ];

                    // Firestore limita los batches a 500 operaciones; usamos grupos de 450.
                    for (let i = 0; i < docsToDelete.length; i += 450) {
                        const batch = writeBatch(db);
                        docsToDelete.slice(i, i + 450).forEach(item => batch.delete(item.ref));
                        await batch.commit();
                    }

                    setParticipants([]);
                    setScores([]);
                    setSelectedGroup(null);
                    setSelectedCategory(null);
                    setSelectedParticipantForPDF(null);
                    setFormScores({});
                    setFormDeductions({});
                    setAudioBase64(null);
                    setCleanupCode('');
                    setShowCleanupModal(false);
                    showMessage(`Limpieza completada: ${docsToDelete.length} registros eliminados`);
                } catch (err) {
                    console.error('Error durante la limpieza total:', err);
                    showMessage('No se pudo completar la limpieza', 'error');
                } finally {
                    setIsCleaning(false);
                }
            };

            const toggleDeduction = (deductionId) => {
                setFormDeductions(prev => ({
                    ...prev,
                    [deductionId]: !prev[deductionId]
                }));
            };

            const totals = useMemo(() => {
                const base = CRITERIA.reduce((acc, c) => {
                    const scoreVal = formScores[c.id];
                    if (scoreVal === undefined || scoreVal === null || scoreVal === "") return acc;
                    const parsed = parseFloat(scoreVal);
                    return acc + (isNaN(parsed) ? 0 : parsed);
                }, 0);
                
                const deductions = DEDUCTIONS_LIST.reduce((acc, d) => {
                    return acc + (formDeductions[d.id] ? d.value : 0);
                }, 0);

                return { 
                    base: parseFloat(base.toFixed(2)), 
                    deductions: parseFloat(deductions.toFixed(2)), 
                    final: Math.max(0, parseFloat((base - deductions).toFixed(2))) 
                };
            }, [formScores, formDeductions]);

            const isFormIncomplete = useMemo(() => {
                return CRITERIA.some(c => {
                    const sVal = formScores[c.id];
                    return sVal === undefined || sVal === null || sVal === "" || isNaN(parseFloat(sVal));
                });
            }, [formScores]);

            const handleValueChange = (criterionId, val) => {
                if (val === "" || val === undefined || val === null) {
                    setFormScores(prev => ({ ...prev, [criterionId]: "" }));
                    return;
                }
                const parsed = parseFloat(val);
                if (isNaN(parsed)) {
                    setFormScores(prev => ({ ...prev, [criterionId]: "" }));
                    return;
                }
                const clamped = Math.max(0, Math.min(2, Math.round(parsed * 100) / 100));
                setFormScores(prev => ({ ...prev, [criterionId]: clamped.toFixed(2) }));
            };

            const saveScore = async (isEdit = false) => {
                if (!selectedGroup || isSubmitting) return;

                const jurorId = currentUserData?.id || 'invitado';
                const existingVote = scores.find(s => s.participantId === selectedGroup.id && s.jurorId === jurorId);
                if (existingVote && !isEdit) {
                    showMessage('Este participante ya fue votado', 'error');
                    setView('groups');
                    return;
                }
                if (isEdit && !existingVote) {
                    showMessage('No se encontró la votación para editar', 'error');
                    setView('groups');
                    return;
                }
                if (isEdit && timerRemaining <= 0) {
                    showMessage('El tiempo para editar ya terminó', 'error');
                    setView('groups');
                    return;
                }

                setIsSubmitting(true);
                const scoreId = `${selectedGroup.id}_${jurorId}`;
                
                const cleanScores = {};
                CRITERIA.forEach(c => {
                    const rawVal = formScores[c.id];
                    const parsed = parseFloat(rawVal);
                    cleanScores[c.id] = (!isNaN(parsed)) ? parseFloat(parsed.toFixed(2)) : 0.00;
                });

                const payloadFirebase = {
                    participantId: selectedGroup.id,
                    participantName: selectedGroup.name,
                    category: selectedGroup.category,
                    jurorId: jurorId,
                    jurorName: currentUserData?.name || 'Jurado',
                    values: cleanScores,
                    deductions: formDeductions,
                    audioNote: "Sin audio",
                    baseScore: totals.base,
                    totalDeductions: totals.deductions,
                    total: parseFloat(totals.final.toFixed(2)),
                    timestamp: Date.now(),
                    hasEdited: isEdit 
                };

                const payloadSheets = {
    ...payloadFirebase,
    audioNote: audioBase64 || "Sin audio"
};

                try {
                    if (user) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'scores', scoreId), { ...payloadFirebase, timestamp: serverTimestamp() });
                    }
                    // El puntaje se guarda primero. El audio se envía a Apps Script/Drive
                    // en segundo plano para que el jurado no tenga que esperar.
                    if (GOOGLE_SHEETS_URL) {
                        fetch(GOOGLE_SHEETS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: JSON.stringify(payloadSheets)
                        }).catch(() => {});
                    }

                    setIsSubmitting(false);
                    if (isEdit) {
                        showMessage('¡Puntaje actualizado!');
                        setEditingVote(false);
                        setView('success');
                    } else {
                        setEditingVote(false);
                        setView('success');
                        setTimerRemaining(20); 
                    }
                } catch (error) { 
                    setIsSubmitting(false);
                    showMessage('Error al guardar datos', 'error'); 
                }
            };

            const toggleCategoryAccordion = (cat) => {
                setExpandedCategories(prev => ({ ...prev, [cat]: !prev[cat] }));
            };

            const getTotalScoreSum = (groupId) => {
                const groupScores = scores.filter(s => s.participantId === groupId);
                if (groupScores.length === 0) return 0;
                const sum = groupScores.reduce((acc, curr) => acc + (curr.total || 0), 0);
                return parseFloat(sum.toFixed(2));
            };

            const filteredScores = useMemo(() => {
                if (!searchTerm) return scores;
                const term = searchTerm.toLowerCase();
                return scores.filter(s => s.jurorName.toLowerCase().includes(term) || s.participantName.toLowerCase().includes(term) || (s.category && s.category.toLowerCase().includes(term)));
            }, [scores, searchTerm]);

            const downloadPDFFile = (participant) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const partScores = scores.filter(s => s.participantId === participant.id);
                const totalSum = getTotalScoreSum(participant.id);

                doc.setFillColor(15, 23, 42);
                doc.rect(0, 0, 210, 35, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(16);
                doc.text("NORTH CHAMPIONS 2026", 14, 18);
                doc.setFontSize(10);
                doc.setTextColor(129, 140, 248);
                doc.text("REPORTE OFICIAL DE CALIFICACIÓN", 14, 26);

                doc.setTextColor(30, 41, 59);
                doc.setFontSize(14);
                doc.text(`Participante: ${participant.name.toUpperCase()}`, 14, 48);
                doc.setFontSize(11);
                doc.setTextColor(100, 116, 139);
                doc.text(`Categoría: ${participant.category}`, 14, 56);
                doc.text(`Cantidad de Integrantes: ${participant.memberCount || 1}`, 14, 64);
                doc.text(`Suma Total (Todos los Jurados): ${totalSum.toFixed(2)} pts`, 14, 72);

                let y = 85;
                if (partScores.length === 0) {
                    doc.setFontSize(12);
                    doc.setTextColor(150, 150, 150);
                    doc.text("Este participante aún no tiene calificaciones registradas.", 14, y);
                } else {
                    partScores.forEach((scoreObj) => {
                        if (y > 230) { doc.addPage(); y = 20; }
                        doc.setFillColor(241, 245, 249);
                        doc.roundedRect(14, y, 182, 12, 2, 2, 'F');
                        doc.setFont("Helvetica", "bold");
                        doc.setFontSize(10);
                        doc.setTextColor(15, 23, 42);
                        doc.text(`${scoreObj.jurorName.toUpperCase()} — Subtotal Jurado: ${scoreObj.total.toFixed(2)}`, 18, y + 8);
                        y += 16;

                        // Desempeño
                        doc.setFont("Helvetica", "bold");
                        doc.setFontSize(9);
                        doc.setTextColor(79, 70, 229);
                        doc.text("DESEMPEÑO:", 18, y);
                        y += 6;

                        doc.setFont("Helvetica", "normal");
                        doc.setTextColor(71, 85, 105);
                        const desempenoKeys = ['creatividad', 'escenario', 'intensidad', 'imagen', 'entretenimiento'];
                        desempenoKeys.forEach(critKey => {
                            const critMeta = CRITERIA.find(c => c.id === critKey);
                            const fullLabel = critMeta ? critMeta.label : critKey;
                            const val = scoreObj.values?.[critKey];
                            if (y > 275) { doc.addPage(); y = 20; }
                            doc.text(`• ${fullLabel}: ${parseFloat(val || 0).toFixed(2)} pts`, 22, y);
                            y += 6;
                        });

                        // Habilidades
                        y += 2;
                        if (y > 250) { doc.addPage(); y = 20; }
                        doc.setFont("Helvetica", "bold");
                        doc.setTextColor(79, 70, 229);
                        doc.text("HABILIDADES:", 18, y);
                        y += 6;

                        doc.setFont("Helvetica", "normal");
                        doc.setTextColor(71, 85, 105);
                        const habilidadesKeys = ['musicalidad', 'sincronizacion', 'ejecucion', 'dificultad', 'variedad'];
                        habilidadesKeys.forEach(critKey => {
                            const critMeta = CRITERIA.find(c => c.id === critKey);
                            const fullLabel = critMeta ? critMeta.label : critKey;
                            const val = scoreObj.values?.[critKey];
                            if (y > 275) { doc.addPage(); y = 20; }
                            doc.text(`• ${fullLabel}: ${parseFloat(val || 0).toFixed(2)} pts`, 22, y);
                            y += 6;
                        });

                        // Penalizaciones
                        y += 2;
                        if (y > 250) { doc.addPage(); y = 20; }
                        doc.setFont("Helvetica", "bold");
                        doc.setTextColor(220, 38, 38);
                        doc.text("PENALIZACIONES APLICADAS:", 18, y);
                        y += 6;

                        doc.setFont("Helvetica", "normal");
                        doc.setTextColor(71, 85, 105);
                        const activeDeductions = scoreObj.deductions ? Object.keys(scoreObj.deductions).filter(k => scoreObj.deductions[k]) : [];
                        
                        if (activeDeductions.length === 0) {
                            doc.text("• Ninguna penalización registrada.", 22, y);
                            y += 6;
                        } else {
                            activeDeductions.forEach(dedId => {
                                const dedMeta = DEDUCTIONS_LIST.find(d => d.id === dedId);
                                const dedLabel = dedMeta ? dedMeta.label : dedId;
                                const dedVal = dedMeta ? dedMeta.value : 0;
                                if (y > 275) { doc.addPage(); y = 20; }
                                doc.text(`• ${dedLabel} (-${dedVal.toFixed(2)} pts)`, 22, y);
                                y += 6;
                            });
                        }
                        y += 10;
                    });
                }

                doc.save(`NorthChampions_${participant.name.replace(/\s+/g, '_')}.pdf`);
            };

            if (view === 'login') return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 text-white text-center">
                    <div className="w-full max-w-sm bg-slate-900 rounded-[2.5rem] p-8 sm:p-12 shadow-2xl border border-slate-800 animate-in mx-auto">
                        {LOGO_URL ? (
                            <img src={LOGO_URL} alt="North Champions Logo" className="h-20 mx-auto mb-6 object-contain drop-shadow-md" onError={(e) => e.target.style.display = 'none'} />
                        ) : (
                            <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-lg rotate-3"><Trophy size={32} /></div>
                        )}
                        <h1 className="text-2xl font-black uppercase tracking-tighter mb-1">North Champions</h1>
                        <p className="text-indigo-400 font-bold text-[10px] uppercase tracking-widest mb-10">Acceso de Personal</p>
                        <input type="password" placeholder="Contraseña" className="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl p-4 mb-6 text-center text-xl font-black outline-none focus:border-indigo-500 transition-all placeholder:text-slate-700" value={password} onChange={(e) => setPassword(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} />
                        <button onClick={handleLogin} className="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-black text-base active:scale-95 transition-all shadow-xl shadow-indigo-600/20 uppercase tracking-widest">INGRESAR</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-10">
                    <header className="bg-slate-950 text-white p-4 sticky top-0 z-50 shadow-xl flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            {LOGO_URL ? (
                                <img src={LOGO_URL} alt="Logo" className="h-8 w-auto object-contain" onError={(e) => e.target.style.display = 'none'} />
                            ) : (
                                <div className="bg-indigo-600 p-2 rounded-xl text-white"><Trophy size={18} /></div>
                            )}
                            <div className="flex flex-col">
                                <span className="font-black text-base tracking-tighter leading-none">NORTH CHAMPIONS</span>
                                <span className="text-[9px] font-bold text-indigo-400 tracking-widest uppercase">Series 2026</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="hidden sm:flex flex-col items-end">
                                <span className="text-[9px] font-black uppercase text-slate-400 leading-none mb-1">{currentUserData?.name}</span>
                                <span className="text-[8px] font-black text-green-500 flex items-center gap-1 uppercase tracking-tighter"><Cloud size={10}/> Online</span>
                            </div>
                            <button onClick={() => { setView('login'); setSelectedParticipantForPDF(null); }} className="bg-slate-800 p-2 rounded-xl text-slate-400 hover:text-red-400 transition-colors"><LogOut size={18} /></button>
                        </div>
                    </header>

                    {message && (
                        <div className={`fixed top-20 left-1/2 -translate-x-1/2 z-[100] px-6 py-2.5 rounded-full shadow-2xl font-black text-[10px] animate-in ${message.type === 'error' ? 'bg-red-600 text-white' : 'bg-indigo-600 text-white'}`}>{message.text.toUpperCase()}</div>
                    )}

                    <main className="max-w-xl mx-auto p-4 sm:p-5">
                        {view === 'categories' && (
                            <div className="space-y-5 animate-in">
                                <h2 className="text-lg font-black text-slate-800 flex items-center gap-3 px-1 uppercase tracking-tight leading-none">Categorías</h2>
                                <div className="grid grid-cols-1 gap-3">
                                    {CATEGORIAS.map(cat => (
                                        <button key={cat} onClick={() => { setSelectedCategory(cat); setView('groups'); }} className="bg-white p-5 rounded-2xl border-2 border-slate-100 shadow-sm flex justify-between items-center group active:scale-95 transition-all text-left">
                                            <span className="text-base font-black text-slate-700">{cat}</span>
                                            <ChevronRight className="text-slate-300 group-hover:text-indigo-600" size={20} />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'groups' && (
                            <div className="space-y-5 animate-in">
                                <button onClick={() => setView('categories')} className="flex items-center gap-2 text-indigo-600 font-black text-[10px] uppercase tracking-widest"><ChevronLeft size={16}/> Volver</button>
                                <h2 className="text-xl font-black text-slate-800">División: <span className="text-indigo-600">{selectedCategory}</span></h2>
                                <div className="space-y-3">
                                    {participants.filter(p => p.category === selectedCategory).map(p => {
                                        const voted = scores.find(s => s.participantId === p.id && s.jurorId === currentUserData?.id);
                                        return (
                                            <button key={p.id} disabled={!!voted} onClick={() => { 
                                                if (voted) return;
                                                setSelectedGroup(p); 
                                                setEditingVote(false);
                                                const initialScores = {};
                                                CRITERIA.forEach(c => {
                                                    initialScores[c.id] = "";
                                                });
                                                setFormScores(initialScores); 
                                                setFormDeductions({}); 
                                                if (audioPreviewUrl) {
                                                    URL.revokeObjectURL(audioPreviewUrl);
                                                }
                                                setAudioPreviewUrl(null);
                                                setAudioBase64(null);
                                                setView('form'); 
                                            }} className={`w-full p-5 rounded-2xl flex justify-between items-center border-2 transition-all ${voted ? 'bg-slate-100 border-slate-200 opacity-70 cursor-not-allowed' : 'bg-white border-slate-100 shadow-sm active:scale-[0.99]'}`}>
                                                <div className="text-left font-black text-lg text-slate-800">{p.name} <span className="text-xs font-bold text-slate-400">({p.memberCount || 1} part.)</span> {voted && <div className="text-[9px] font-black text-slate-500 uppercase mt-0.5 flex items-center gap-1"><CheckCircle2 size={12}/> Votación cerrada</div>}</div>
                                                <ChevronRight className="text-slate-300" size={20} />
                                            </button>
                                        );
                                    })}
                                    {participants.filter(p => p.category === selectedCategory).length === 0 && <div className="p-12 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200 text-slate-400 font-bold uppercase text-[10px]">Sin competidores todavía</div>}
                                </div>
                            </div>
                        )}

                        {view === 'form' && selectedGroup && (
                            <div className="space-y-6 animate-in">
                                <button onClick={() => setView('groups')} className="flex items-center gap-2 text-indigo-600 font-black text-[10px] uppercase tracking-widest"><ChevronLeft size={16}/> Atrás</button>
                                <div className="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-slate-200">
                                    <div className="bg-slate-950 p-6 text-white relative">
                                        <div className="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">{selectedGroup.category} • Integrantes: {selectedGroup.memberCount || 1}</div>
                                        <h2 className="text-2xl font-black tracking-tight leading-none">{selectedGroup.name}</h2>
                                    </div>
                                    <div className="p-5 sm:p-8 space-y-8">
                                        {['Desempeño', 'Habilidades'].map(section => (
                                            <div key={section} className="space-y-4">
                                                <h3 className="text-[9px] font-black uppercase text-slate-400 tracking-[0.4em] border-b border-slate-100 pb-2">{section}</h3>
                                                {CRITERIA.filter(c => section === c.section).map(c => {
                                                    const rawValue = formScores[c.id];
                                                    const parsedVal = parseFloat(rawValue);
                                                    const isSet = rawValue !== undefined && rawValue !== null && rawValue !== "" && !isNaN(parsedVal);
                                                    return (
                                                        <div key={c.id} className="space-y-3 bg-slate-50/70 p-4 rounded-2xl border border-slate-100">
                                                            <div className="flex justify-between items-center">
                                                                <label className="text-xs font-black text-slate-700 block pr-2 leading-tight">{c.label}</label>
                                                                <span className="text-xl font-black text-indigo-600 tabular-nums">
                                                                    {isSet ? parsedVal.toFixed(2) : "0.00"}
                                                                </span>
                                                            </div>
                                                            
                                                            <div className="flex items-center gap-2">
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => {
                                                                        const current = isSet ? parsedVal : 0.00;
                                                                        handleValueChange(c.id, current - 0.01);
                                                                    }}
                                                                    className="bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 w-11 h-11 rounded-xl flex items-center justify-center font-black text-xl shadow-sm active:scale-95 transition-all select-none"
                                                                >
                                                                    -
                                                                </button>
                                                                
                                                                <input 
                                                                    type="text" 
                                                                    inputMode="decimal" 
                                                                    placeholder="0.00"
                                                                    value={rawValue !== undefined ? rawValue : ""} 
                                                                    onChange={(e) => {
                                                                        let inputVal = e.target.value.replace(',', '.');
                                                                        if (inputVal === "") {
                                                                            setFormScores(prev => ({ ...prev, [c.id]: "" }));
                                                                            return;
                                                                        }
                                                                        if (inputVal === ".") {
                                                                            setFormScores(prev => ({ ...prev, [c.id]: "0." }));
                                                                            return;
                                                                        }
                                                                        const clean = inputVal.replace(/[^0-9.]/g, '');
                                                                        const parts = clean.split('.');
                                                                        if (parts.length > 2) return;
                                                                        if (parts[1] && parts[1].length > 2) return;

                                                                        const parsedNum = parseFloat(clean);
                                                                        if (!isNaN(parsedNum)) {
                                                                            if (parsedNum > 2.0) {
                                                                                setFormScores(prev => ({ ...prev, [c.id]: "2.00" }));
                                                                            } else {
                                                                                setFormScores(prev => ({ ...prev, [c.id]: clean }));
                                                                            }
                                                                        }
                                                                    }}
                                                                    onFocus={(e) => e.target.select()}
                                                                    onBlur={() => {
                                                                        const raw = formScores[c.id];
                                                                        if (raw === undefined || raw === null || raw === "" || isNaN(parseFloat(raw))) {
                                                                            handleValueChange(c.id, 0.00);
                                                                        } else {
                                                                            handleValueChange(c.id, parseFloat(raw));
                                                                        }
                                                                    }}
                                                                    className="flex-1 bg-white border-2 border-slate-200 rounded-xl h-11 text-center font-black text-xl text-slate-800 focus:border-indigo-500 outline-none transition-all"
                                                                />
                                                                
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => {
                                                                        const current = isSet ? parsedVal : 0.00;
                                                                        handleValueChange(c.id, current + 0.01);
                                                                    }}
                                                                    className="bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 w-11 h-11 rounded-xl flex items-center justify-center font-black text-xl shadow-sm active:scale-95 transition-all select-none"
                                                                >
                                                                    +
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ))}

                                        <div className="bg-red-50/50 p-5 rounded-3xl border border-red-100 space-y-4">
                                            <h3 className="text-[9px] font-black uppercase text-red-500 tracking-[0.4em] flex items-center gap-2"><MinusCircle size={14}/> Penalizaciones</h3>
                                            <div className="space-y-2">
                                                {DEDUCTIONS_LIST.map(d => (
                                                    <button 
                                                        key={d.id} 
                                                        type="button"
                                                        onClick={() => toggleDeduction(d.id)} 
                                                        className={`w-full p-3.5 rounded-2xl flex justify-between items-center transition-all border ${formDeductions[d.id] ? 'bg-red-600 text-white border-red-700 shadow-md' : 'bg-white text-slate-600 border-slate-200'}`}
                                                    >
                                                        <span className="text-[11px] font-bold text-left pr-3 leading-tight">{d.label}</span>
                                                        <span className={`text-[10px] font-black ${formDeductions[d.id] ? 'text-white' : 'text-red-500'}`}>-{d.value.toFixed(2)}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Audio Recorder */}
                                        <div className="bg-slate-900 text-white p-5 rounded-3xl space-y-3 shadow-xl">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-400 flex items-center gap-2">
                                                    <Mic size={14}/> Nota de Voz (Opcional)
                                                </span>
                                                {isRecording && (
                                                    <span className="text-[10px] font-black text-red-400 animate-pulse uppercase">
                                                        ● {Math.floor(recordingTime / 60)}:{String(recordingTime % 60).padStart(2, '0')}
                                                    </span>
                                                )}
                                            </div>

                                            {!audioPreviewUrl && !isRecording && (
                                                <button
                                                    type="button"
                                                    onClick={startRecording}
                                                    className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all"
                                                >
                                                    <Mic size={16} className="text-indigo-400" /> Grabar Comentario
                                                </button>
                                            )}

                                            {isRecording && (
                                                <button
                                                    type="button"
                                                    onClick={stopRecording}
                                                    className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg"
                                                >
                                                    <Square size={16} /> Detener Grabación
                                                </button>
                                            )}

                                            {audioPreviewUrl && !isRecording && (
                                                <div className="space-y-2 bg-slate-800 p-3 rounded-xl border border-slate-700">
                                                    <audio
                                                        src={audioPreviewUrl}
                                                        controls
                                                        preload="metadata"
                                                        className="w-full h-9 rounded-lg"
                                                    />
                                                    <button
                                                        type="button"
                                                        onClick={discardAudio}
                                                        className="text-[10px] text-red-400 font-black uppercase tracking-wider hover:text-red-300 flex items-center gap-1 mx-auto"
                                                    >
                                                        <Trash2 size={12} /> Borrar audio
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        <div className="pt-6 border-t sticky bottom-0 bg-white pb-3 z-10">
                                            <div className="space-y-1 mb-5 px-1">
                                                <div className="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-slate-400"><span>Puntaje Base</span><span>{totals.base.toFixed(2)} / 20.00</span></div>
                                                <div className="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-red-500/70"><span>Penalizaciones</span><span>-{totals.deductions.toFixed(2)}</span></div>
                                                <div className="flex justify-between items-end mt-3 pt-2 border-t border-slate-100">
                                                    <span className="font-black text-slate-400 uppercase text-[10px] tracking-widest">Total</span>
                                                    <span className="text-5xl font-black text-indigo-600 tabular-nums leading-none tracking-tighter">{totals.final.toFixed(2)}</span>
                                                </div>
                                            </div>
                                            <button 
                                                disabled={isFormIncomplete || isSubmitting} 
                                                onClick={() => saveScore(editingVote)} 
                                                className={`w-full py-5 rounded-2xl font-black text-lg shadow-xl transition-all uppercase tracking-widest ${isFormIncomplete || isSubmitting ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-indigo-600 text-white active:scale-95'}`}
                                            >
                                                {isSubmitting ? 'GUARDANDO...' : (editingVote ? 'ACTUALIZAR VOTO' : 'ENVIAR VOTO')}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'success' && (
                            <div className="py-16 text-center animate-in zoom-in">
                                <div className="bg-green-100 text-green-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><CheckCircle2 size={48} /></div>
                                <h2 className="text-3xl font-black text-slate-900 mb-1 uppercase tracking-tight">¡Enviado!</h2>
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-amber-100 w-full max-w-xs mx-auto mt-8">
                                    <div className="text-5xl font-black text-amber-500 mb-2 tabular-nums tracking-tighter">{timerRemaining}s</div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Votación registrada. Podés corregirla durante 20 segundos.</p>
                                    {timerRemaining > 0 && (
                                        <button
                                            onClick={() => {
                                                const jurorId = currentUserData?.id || 'invitado';
                                                const existingVote = scores.find(s => s.participantId === selectedGroup?.id && s.jurorId === jurorId);
                                                if (!existingVote || timerRemaining <= 0) return;
                                                setFormScores(existingVote.values || {});
                                                setFormDeductions(existingVote.deductions || {});
                                                setEditingVote(true);
                                                setView('form');
                                            }}
                                            className="w-full bg-amber-500 text-white py-4 rounded-xl font-black text-base active:scale-95 uppercase shadow-lg shadow-amber-500/20 mb-3"
                                        >
                                            EDITAR VOTACIÓN
                                        </button>
                                    )}
                                    <button onClick={() => { setTimerRemaining(0); setEditingVote(false); setView('categories'); setSelectedGroup(null); }} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-base active:scale-95 uppercase shadow-lg shadow-indigo-600/20">Continuar</button>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && !selectedParticipantForPDF && (
                            <div className="space-y-10 pb-20 animate-in">
                                <div className="bg-white p-6 sm:p-8 rounded-[2.5rem] border border-slate-200 shadow-xl space-y-6">
                                    <div className="flex items-center gap-3 border-b border-slate-100 pb-3">
                                        <div className="bg-indigo-50 p-2.5 rounded-2xl text-indigo-600"><UserPlus size={22}/></div>
                                        <h3 className="text-lg font-black tracking-tight uppercase leading-none">Gestión de Competidores</h3>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-3">
                                            <h4 className="text-[10px] font-black uppercase text-indigo-500 tracking-widest flex items-center gap-1.5"><Plus size={14}/> Individual</h4>
                                            <div className="space-y-2.5">
                                                <input type="text" placeholder="Nombre" className="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3.5 font-bold outline-none focus:border-indigo-500 transition-all text-sm" value={newParticipantName} onChange={(e) => setNewParticipantName(e.target.value)} />
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-bold text-slate-500">Integrantes:</span>
                                                    <input type="number" min="1" value={newParticipantCount} onChange={(e) => setNewParticipantCount(e.target.value)} className="w-24 bg-slate-50 border-2 border-slate-100 rounded-xl p-2 font-bold text-center outline-none focus:border-indigo-500 text-sm" />
                                                </div>
                                                <select className="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3.5 font-bold outline-none appearance-none cursor-pointer text-sm" value={currentCategory} onChange={(e) => setCurrentCategory(e.target.value)}>
                                                    {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                                <button onClick={async () => {
                                                    if (!newParticipantName.trim()) return;
                                                    const count = parseInt(newParticipantCount) || 1;
                                                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'participants'), { name: newParticipantName.trim(), memberCount: count, category: currentCategory, createdAt: Date.now() });
                                                    setNewParticipantName('');
                                                    setNewParticipantCount('1');
                                                    showMessage('Participante registrado');
                                                }} className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-black uppercase text-xs tracking-widest active:scale-95 transition-all shadow-lg shadow-indigo-600/10">Agregar</button>
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            <h4 className="text-[10px] font-black uppercase text-indigo-500 tracking-widest flex items-center gap-1.5"><ClipboardList size={14}/> Carga Masiva</h4>
                                            <div className="space-y-2.5">
                                                <textarea placeholder="Formato por línea: Nombre - Cantidad&#10;Ejemplo: Crew Estilo Urbano - 8" className="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3.5 font-bold outline-none h-[112px] resize-none text-xs" value={bulkList} onChange={(e) => setBulkList(e.target.value)} />
                                                <button onClick={async () => {
                                                    if (!bulkList.trim()) return;
                                                    const lines = bulkList.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                                                    const batch = writeBatch(db);
                                                    let countAdded = 0;
                                                    lines.forEach(line => {
                                                        let name = line;
                                                        let memberCount = 1;
                                                        if (line.includes('-')) {
                                                            const parts = line.split('-');
                                                            name = parts[0].trim();
                                                            const parsedNum = parseInt(parts[1].trim());
                                                            if (!isNaN(parsedNum)) memberCount = parsedNum;
                                                        }
                                                        const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'participants'));
                                                        batch.set(newRef, { name, memberCount, category: currentCategory, createdAt: Date.now() });
                                                        countAdded++;
                                                    });
                                                    await batch.commit();
                                                    setBulkList('');
                                                    showMessage(`${countAdded} sincronizados`);
                                                }} className="w-full bg-slate-900 text-white py-3.5 rounded-xl font-black uppercase text-xs tracking-widest active:scale-95 flex items-center justify-center gap-2">
                                                    <UploadCloud size={16}/> PROCESAR
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-4 border-t border-slate-100 pt-5">
                                        <h4 className="text-[10px] font-black uppercase text-slate-400 mb-3 px-1 tracking-widest">Base de Datos ({participants.length})</h4>
                                        <div className="max-h-52 overflow-y-auto space-y-2 pr-1">
                                            {participants.sort((a,b) => b.createdAt - a.createdAt).map(p => (
                                                <div key={p.id} className="flex justify-between items-center bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                                                    <div><div className="font-bold text-slate-800 text-sm leading-none mb-1">{p.name} <span className="text-xs font-bold text-indigo-600">({p.memberCount || 1} part.)</span></div><div className="text-[9px] font-black text-indigo-500 uppercase tracking-tighter">{p.category}</div></div>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => setSelectedParticipantForPDF(p)} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-1 transition-colors"><FileText size={14}/> Ver PDF</button>
                                                        <button onClick={async () => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', p.id))} className="text-slate-300 hover:text-red-600 transition-colors p-2"><Trash2 size={16} /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Registro de Actividad */}
                                <div className="bg-slate-900 rounded-[2.5rem] p-6 sm:p-8 text-white shadow-2xl overflow-hidden border border-white/5">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 px-1 gap-4">
                                        <h3 className="text-lg font-black flex items-center gap-2.5 uppercase tracking-tight leading-none"><Users size={20} className="text-indigo-400" /> Registro de Actividad</h3>
                                        <div className="relative">
                                            <Search size={14} className="absolute inset-y-0 left-3.5 my-auto text-slate-500" />
                                            <input type="text" placeholder="Filtrar votos..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="bg-slate-800 border-2 border-slate-700 text-white text-xs rounded-xl py-2.5 pl-10 pr-3 w-full sm:w-64 outline-none focus:border-indigo-500 transition-all font-bold placeholder:text-slate-600" />
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-[11px]">
                                            <thead>
                                                <tr className="text-slate-500 border-b border-slate-800 uppercase tracking-widest font-black"><th className="p-3">Jurado</th><th className="p-3">Categoría</th><th className="p-3">Grupo</th><th className="p-3 text-right">Total</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800 font-bold">
                                                {filteredScores.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).map(s => (
                                                    <tr key={s.id} className="hover:bg-slate-800/50 transition-colors">
                                                        <td className="p-3 text-slate-400 uppercase tracking-tighter">{s.jurorName}</td>
                                                        <td className="p-3"><span className="bg-indigo-500/20 text-indigo-400 px-2.5 py-0.5 rounded-full text-[8px] uppercase font-black tracking-tighter">{s.category}</span></td>
                                                        <td className="p-3 text-white text-xs leading-none">{s.participantName}</td>
                                                        <td className="p-3 text-right font-black text-indigo-400 text-sm tabular-nums">{s.total?.toFixed(2)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Podio General & Ranking Completo */}
                                <div className="space-y-6 pb-10">
                                    <h2 className="text-2xl sm:text-3xl font-black tracking-tighter flex items-center gap-3 border-b border-slate-200 pb-6 px-1 uppercase leading-none">
                                        <BarChart3 className="text-indigo-600" size={32} /> Podio y Ranking
                                    </h2>
                                    {CATEGORIAS.map(cat => {
                                        const catParticipants = participants.filter(p => p.category === cat);
                                        if (catParticipants.length === 0) return null;
                                        
                                        const rankedAll = catParticipants.map(p => ({ ...p, totalSum: getTotalScoreSum(p.id) })).sort((a, b) => b.totalSum - a.totalSum);
                                        const top3 = rankedAll.slice(0, 3);
                                        const rest = rankedAll.slice(3);
                                        const isExpanded = expandedCategories[cat];

                                        return (
                                            <div key={cat} className="space-y-4 bg-white p-6 sm:p-8 rounded-[2.5rem] border border-slate-200 shadow-xl animate-in">
                                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                                    <h3 className="text-xs font-black text-indigo-600 uppercase tracking-[0.3em]">{cat}</h3>
                                                    <span className="text-[10px] font-bold text-slate-400">{catParticipants.length} Competidores</span>
                                                </div>

                                                <div className="space-y-3">
                                                    {top3.map((p, idx) => (
                                                        <div key={p.id} className="bg-slate-50 p-5 rounded-2xl border border-slate-100 flex items-center gap-4">
                                                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-lg text-white shadow-md ${idx === 0 ? 'bg-amber-400' : idx === 1 ? 'bg-slate-400' : 'bg-amber-700'}`}>
                                                                {idx + 1}
                                                            </div>
                                                            <div className="flex-1">
                                                                <div className="font-black text-lg text-slate-800 uppercase leading-tight mb-0.5">{p.name} <span className="text-xs font-bold text-indigo-600 font-mono">({p.memberCount || 1} part.)</span></div>
                                                                <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{scores.filter(s => s.participantId === p.id).length} Jurados calificados</div>
                                                            </div>
                                                            <div className="flex items-center gap-2.5">
                                                                <div className="text-right bg-white px-4 py-2 rounded-xl border border-slate-200">
                                                                    <div className="text-xl font-black text-indigo-600 leading-none mb-0.5 tabular-nums">{p.totalSum.toFixed(2)}</div>
                                                                    <div className="text-[8px] font-black text-slate-400 uppercase tracking-widest leading-none">Total</div>
                                                                </div>
                                                                <button onClick={() => setSelectedParticipantForPDF(p)} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 p-2.5 rounded-xl font-black transition-colors" title="Ver Reporte PDF"><FileText size={16}/></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {rest.length > 0 && (
                                                    <div className="pt-2">
                                                        <button 
                                                            onClick={() => toggleCategoryAccordion(cat)}
                                                            className="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 px-5 rounded-xl font-black text-xs uppercase tracking-widest flex justify-between items-center transition-all shadow-md"
                                                        >
                                                            <span>{isExpanded ? 'Ocultar resto del ranking' : `Ver ${rest.length} competidores siguientes`}</span>
                                                            <ChevronDown className={`transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} size={16} />
                                                        </button>

                                                        {isExpanded && (
                                                            <div className="mt-3 space-y-2.5 pt-1 animate-in">
                                                                {rest.map((p, rIdx) => (
                                                                    <div key={p.id} className="bg-slate-50/70 p-4 rounded-xl border border-slate-100 flex items-center justify-between">
                                                                        <div className="flex items-center gap-3">
                                                                            <span className="font-mono font-black text-slate-400 text-xs">#{rIdx + 4}</span>
                                                                            <div>
                                                                                <div className="font-bold text-slate-800 uppercase text-xs leading-none mb-1">{p.name} <span className="text-[10px] text-indigo-600 font-mono">({p.memberCount || 1} part.)</span></div>
                                                                                <div className="text-[9px] text-slate-400 uppercase tracking-wider">{scores.filter(s => s.participantId === p.id).length} jueces</div>
                                                                            </div>
                                                                        </div>
                                                                        <div className="flex items-center gap-2.5">
                                                                            <span className="font-black text-indigo-600 text-base tabular-nums">{p.totalSum.toFixed(2)}</span>
                                                                            <button onClick={() => setSelectedParticipantForPDF(p)} className="bg-white text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg border border-slate-200 transition-colors" title="Ver Reporte PDF"><FileText size={14}/></button>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
