<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Champions 2026</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbwWErMfb1kwoJgsmhXtdO8BDe_Kkez8m0V4ZF-Aiu3WDq-SwNc-oxBUiv1FuBh3Z2D2/exec";
    const LOGO_URL = "./logo.png"; 

    // CONFIGURACIÓN REAL DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCLW7tZxGuecMGa7FgWuvGMcxi4x_5wD7w",
      authDomain: "north-champions-2026.firebaseapp.com",
      projectId: "north-champions-2026",
      storageBucket: "north-champions-2026.firebasestorage.app",
      messagingSenderId: "14904881173",
      appId: "1:14904881173:web:97937bc54d5d309155f81c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    const CRITERIA = [
      { id: 'creatividad', label: '1. Creatividad', max: 2 },
      { id: 'escenario', label: '2. Escenario, Espacio y Transiciones', max: 2 },
      { id: 'intensidad', label: '3. Intensidad, Proyección y Presencia', max: 2 },
      { id: 'imagen', label: '4. Imagen Urbana', max: 2 },
      { id: 'entretenimiento', label: '5. Entretenimiento / Atracción', max: 2 },
      { id: 'musicalidad', label: 'I. Musicalidad', max: 2 },
      { id: 'sincronizacion', label: 'II. Sincronización', max: 2 },
      { id: 'ejecucion', label: 'III. Ejecución', max: 2 },
      { id: 'dificultad', label: 'IV. Dificultad Estilos Urbanos', max: 2 },
      { id: 'variedad', label: 'V. Variedad de Estilo', max: 2 }
    ];

    const DEDUCTIONS_LIST = [
      { id: 'miembros_inicio', label: 'Miembros no en escenario al inicio', value: 1.00 },
      { id: 'caida_mayor', label: 'Caída grado mayor', value: 0.10 },
      { id: 'caida_menor', label: 'Caída grado menor', value: 0.05 },
      { id: 'reinicios_rutina', label: 'Reinicio de rutina', value: 1.00 },
      { id: 'fuera_tiempo', label: 'Duración fuera de tiempo', value: 1.00 },
      { id: 'lenguaje_inapropiado', label: 'Lenguaje inapropiado', value: 0.05 },
      { id: 'gestos_obscenos', label: 'Gestos obscenos', value: 0.10 },
      { id: 'vestimenta_inapropiada', label: 'Vestimenta inapropiada', value: 0.05 },
      { id: 'pinturas_confeti', label: 'Uso de pinturas/confeti', value: 1.00 },
      { id: 'accesorios_lanzados', label: 'Ropa/accesorios lanzados', value: 0.10 }
    ];

    const JURADOS = [
      { id: 'juez1', name: 'Jurado 1', pass: 'dance101' },
      { id: 'juez2', name: 'Jurado 2', pass: 'dance202' },
      { id: 'juez3', name: 'Jurado 3', pass: 'dance303' },
      { id: 'admin', name: 'Administrador', pass: 'master99' }
    ];

    const CATEGORIAS = [
      'Solista', 'Dúo/Trío', 'Solista Juvenil', 'Pre Junior', 'Junior',
      'Varsity', 'Adult', 'Mini Crew Kids', 'Mini Crew', 'Mega Kids', 'Mega Crew'
    ];

    function App() {
      const [currentUserData, setCurrentUserData] = useState(null);
      const [password, setPassword] = useState("");
      const [view, setView] = useState('login'); 
      const [message, setMessage] = useState(null);

      const [selectedCategory, setSelectedCategory] = useState(null);
      const [selectedGroup, setSelectedGroup] = useState(null);

      const [participants, setParticipants] = useState([]);
      const [scores, setScores] = useState([]);

      const [formScores, setFormScores] = useState({});
      const [formDeductions, setFormDeductions] = useState({});

      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [audioBase64, setAudioBase64] = useState(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const [singleName, setSingleName] = useState("");
      const [bulkList, setBulkList] = useState("");
      const [currentCategory, setCurrentCategory] = useState(CATEGORIAS[0]);

      useEffect(() => {
        auth.signInAnonymously().catch(err => console.log("Firebase Auth:", err));
      }, []);

      // Sincronización en tiempo real para todos los dispositivos
      useEffect(() => {
        const unsubParticipants = db.collection('participants').onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setParticipants(list);
        });

        const unsubScores = db.collection('scores').onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setScores(list);
        });

        return () => {
          unsubParticipants();
          unsubScores();
        };
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        let interval;
        if (isRecording) {
          interval = setInterval(() => {
            setRecordingTime(prev => prev >= 240 ? (stopRecording(), 240) : prev + 1);
          }, 1000);
        } else {
          setRecordingTime(0);
        }
        return () => clearInterval(interval);
      }, [isRecording]);

      const showMessage = (text, type = 'success') => {
        setMessage({ text, type });
        setTimeout(() => setMessage(null), 3500);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const found = JURADOS.find(j => j.pass === password);
        if (found) {
          setCurrentUserData(found);
          setPassword("");
          setView(found.id === 'admin' ? 'admin' : 'categories');
        } else {
          showMessage("Contraseña incorrecta", "error");
        }
      };

      // Guardar participante en Firebase
      const handleAddSingle = async () => {
        if (!singleName.trim()) return;
        try {
          await db.collection('participants').add({
            name: singleName.trim(),
            category: currentCategory,
            createdAt: new Date().toISOString()
          });
          setSingleName("");
          showMessage("Participante agregado con éxito");
        } catch (err) {
          showMessage("Error al guardar participante", "error");
        }
      };

      // Carga Masiva a Firebase
      const handleBulkAdd = async () => {
        const lines = bulkList.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) return;
        try {
          const batch = db.batch();
          lines.forEach(name => {
            const ref = db.collection('participants').doc();
            batch.set(ref, {
              name,
              category: currentCategory,
              createdAt: new Date().toISOString()
            });
          });
          await batch.commit();
          setBulkList("");
          showMessage(`Se agregaron ${lines.length} participantes`);
        } catch (err) {
          showMessage("Error al cargar participantes", "error");
        }
      };

      const handleDeleteParticipant = async (id) => {
        if (confirm("¿Eliminar este participante?")) {
          try {
            await db.collection('participants').doc(id).delete();
            showMessage("Participante eliminado");
          } catch (err) {
            showMessage("Error al eliminar", "error");
          }
        }
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];
          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          mediaRecorderRef.current.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => setAudioBase64(reader.result);
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (err) {
          showMessage("No se pudo acceder al micrófono", "error");
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      const totalBaseScore = useMemo(() => {
        return CRITERIA.reduce((acc, c) => acc + (parseFloat(formScores[c.id]) || 0), 0);
      }, [formScores]);

      const totalDeductions = useMemo(() => {
        return DEDUCTIONS_LIST.reduce((acc, d) => acc + ((parseInt(formDeductions[d.id]) || 0) * d.value), 0);
      }, [formDeductions]);

      const finalTotal = useMemo(() => {
        const total = totalBaseScore - totalDeductions;
        return total < 0 ? 0 : total;
      }, [totalBaseScore, totalDeductions]);

      const isFormIncomplete = useMemo(() => {
        return CRITERIA.some(c => formScores[c.id] === undefined || formScores[c.id] === "");
      }, [formScores]);

      const handleSubmitVote = async () => {
        if (isFormIncomplete) {
          showMessage("Completa todos los criterios antes de enviar", "error");
          return;
        }

        const votePayload = {
          juezId: currentUserData.id,
          juezName: currentUserData.name,
          categoria: selectedCategory,
          participanteId: selectedGroup.id,
          participanteName: selectedGroup.name,
          scores: formScores,
          deductions: formDeductions,
          totalBase: totalBaseScore.toFixed(2),
          totalDescuentos: totalDeductions.toFixed(2),
          notaFinal: finalTotal.toFixed(2),
          audio: audioBase64 || "",
          timestamp: new Date().toISOString()
        };

        try {
          await db.collection('scores').add(votePayload);

          if (GOOGLE_SHEETS_URL) {
            fetch(GOOGLE_SHEETS_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(votePayload)
            }).catch(e => console.log("Google Sheets sync:", e));
          }

          showMessage("¡Voto registrado y enviado!");
          setFormScores({});
          setFormDeductions({});
          setAudioBase64(null);
          setSelectedGroup(null);
          setView('categories');
        } catch (err) {
          showMessage("Error al guardar la puntuación", "error");
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6">
          {message && (
            <div className={`fixed top-4 right-4 z-50 p-4 rounded-xl shadow-2xl border text-white font-medium flex items-center gap-3 ${
              message.type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-emerald-600 border-emerald-500'
            }`}>
              <span>{message.text}</span>
            </div>
          )}

          <header className="flex flex-col items-center justify-center mb-8 border-b border-slate-800 pb-6">
            {LOGO_URL && (
              <img src={LOGO_URL} alt="Logo" className="h-24 md:h-32 object-contain mb-3" onError={(e) => e.target.style.display = 'none'} />
            )}
            <h1 className="text-3xl md:text-4xl font-extrabold tracking-wider bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600 bg-clip-text text-transparent text-center">
              NORTH CHAMPIONS 2026
            </h1>
            {currentUserData && (
              <div className="flex items-center gap-4 mt-3 bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700 text-xs text-slate-300">
                <span className="font-semibold text-yellow-400">{currentUserData.name}</span>
                <button onClick={() => { setCurrentUserData(null); setView('login'); }} className="hover:text-rose-400 underline">
                  Cerrar Sesión
                </button>
              </div>
            )}
          </header>

          {view === 'login' && (
            <div className="max-w-md mx-auto bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
              <h2 className="text-xl font-bold text-center text-slate-100 mb-6">Ingreso al Sistema</h2>
              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="Introduce tu clave..."
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 text-center font-mono tracking-widest"
                />
                <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3.5 rounded-xl">
                  INGRESAR
                </button>
              </form>
            </div>
          )}

          {view === 'categories' && (
            <div className="space-y-6">
              <h2 className="text-xl font-bold border-l-4 border-yellow-500 pl-3">Selecciona Categoría</h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                {CATEGORIAS.map(cat => (
                  <button
                    key={cat}
                    onClick={() => { setSelectedCategory(cat); setSelectedGroup(null); }}
                    className={`p-3.5 rounded-xl border text-left flex flex-col justify-between ${
                      selectedCategory === cat ? 'bg-yellow-500/20 border-yellow-500 text-yellow-300' : 'bg-slate-800 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>{cat}</span>
                    <span className="text-[10px] text-slate-400 mt-2">{participants.filter(p => p.category === cat).length} competidores</span>
                  </button>
                ))}
              </div>

              {selectedCategory && (
                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                  <h3 className="text-lg font-bold text-yellow-400 mb-4">Competidores en {selectedCategory}:</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {participants.filter(p => p.category === selectedCategory).map(group => {
                      const hasVoted = scores.some(s => s.participanteId === group.id && s.juezId === currentUserData.id);
                      return (
                        <button
                          key={group.id}
                          onClick={() => { setSelectedGroup(group); setView('scoring'); }}
                          className={`p-4 rounded-xl border text-left flex items-center justify-between ${
                            hasVoted ? 'bg-emerald-950/40 border-emerald-800 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-200'
                          }`}
                        >
                          <div>
                            <div className="font-bold">{group.name}</div>
                            <div className="text-xs text-slate-400">{hasVoted ? '✓ Ya evaluado por ti' : 'Pendiente'}</div>
                          </div>
                          <span className="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Evaluar →</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {view === 'scoring' && selectedGroup && (
            <div className="space-y-6">
              <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex items-center justify-between">
                <div>
                  <span className="text-xs uppercase text-yellow-500 font-semibold">{selectedCategory}</span>
                  <h2 className="text-2xl font-black text-white">{selectedGroup.name}</h2>
                </div>
                <button onClick={() => setView('categories')} className="text-xs bg-slate-700 px-4 py-2 rounded-xl">← Cambiar Grupo</button>
              </div>

              <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <h3 className="text-lg font-bold text-yellow-400">Puntuación por Criterios (Máx 2.00)</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {CRITERIA.map(c => (
                    <div key={c.id} className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                      <label className="text-xs text-slate-300">{c.label}</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="2"
                        value={formScores[c.id] !== undefined ? formScores[c.id] : ""}
                        onChange={(e) => setFormScores(prev => ({ ...prev, [c.id]: e.target.value }))}
                        placeholder="0.00"
                        className="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-right text-yellow-400 font-bold"
                      />
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <h3 className="text-lg font-bold text-sky-400">Devolución de Audio</h3>
                <div className="flex flex-col items-center justify-center p-4 bg-slate-900 rounded-xl border border-dashed border-slate-700 gap-3">
                  {!isRecording && !audioBase64 && (
                    <button onClick={startRecording} className="bg-sky-600 text-white font-bold px-6 py-2.5 rounded-full">🎙️ Iniciar Grabación</button>
                  )}
                  {isRecording && (
                    <button onClick={stopRecording} className="bg-rose-600 text-white font-bold px-6 py-2.5 rounded-full animate-pulse">⏹ DETENER ({recordingTime}s)</button>
                  )}
                  {audioBase64 && !isRecording && (
                    <audio src={audioBase64} controls className="w-full max-w-md" />
                  )}
                </div>
              </div>

              <div className="bg-slate-800 p-6 rounded-2xl border border-yellow-500/50 flex items-center justify-between">
                <div>
                  <div className="text-xs text-slate-400 uppercase">Total Final</div>
                  <div className="text-3xl font-mono text-yellow-400 font-bold">{finalTotal.toFixed(2)}</div>
                </div>
                <button
                  onClick={handleSubmitVote}
                  disabled={isFormIncomplete}
                  className={`px-8 py-3.5 rounded-xl font-bold ${isFormIncomplete ? 'bg-slate-700 text-slate-500' : 'bg-yellow-500 text-slate-950 hover:bg-yellow-400'}`}
                >
                  ENVIAR VOTO
                </button>
              </div>
            </div>
          )}

          {view === 'admin' && (
            <div className="space-y-6">
              <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <h3 className="text-lg font-bold text-yellow-400">GESTIÓN DE COMPETIDORES</h3>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                    <h4 className="text-sm font-bold text-slate-300">+ INDIVIDUAL</h4>
                    <select value={currentCategory} onChange={(e) => setCurrentCategory(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-xs">
                      {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <input
                      type="text"
                      value={singleName}
                      onChange={(e) => setSingleName(e.target.value)}
                      placeholder="Nombre del competidor..."
                      className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-xs text-white"
                    />
                    <button onClick={handleAddSingle} className="w-full bg-yellow-500 text-slate-950 font-bold py-2 rounded text-xs">
                      Guardar Competidor
                    </button>
                  </div>

                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                    <h4 className="text-sm font-bold text-slate-300">📋 CARGA MASIVA</h4>
                    <textarea
                      rows="3"
                      value={bulkList}
                      onChange={(e) => setBulkList(e.target.value)}
                      placeholder="Un nombre por línea..."
                      className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white"
                    />
                    <button onClick={handleBulkAdd} className="w-full bg-amber-600 text-white font-bold py-2 rounded text-xs">
                      Cargar Lista Completa
                    </button>
                  </div>
                </div>
              </div>

              <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <h3 className="text-lg font-bold text-white">Competidores Registrados ({participants.length})</h3>
                <div className="divide-y divide-slate-700">
                  {participants.map(p => (
                    <div key={p.id} className="py-2 flex items-center justify-between text-xs">
                      <div>
                        <span className="font-bold text-slate-200">{p.name}</span>
                        <span className="ml-2 text-yellow-500">({p.category})</span>
                      </div>
                      <button onClick={() => handleDeleteParticipant(p.id)} className="text-rose-400 hover:underline">Eliminar</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
