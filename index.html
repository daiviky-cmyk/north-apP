<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Champions 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- jsPDF Library for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useMemo } = React;

        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp, addDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- ICONOS SVG ---
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Trophy = (props) => <Icon {...props} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 22V18"/><path d="M14 22V18"/><path d="M18 4H6v7a6 6 0 0 0 12 0V4Z"/></>} />;
        const LogOut = (props) => <Icon {...props} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>} />;
        const Cloud = (props) => <Icon {...props} path={<path d="M17.5 19a5.5 5.5 0 0 0 2.5-10.5 8.5 8.5 0 1 0-15.5 1.5A5.5 5.5 0 0 0 4.5 19Z"/>} />;
        const ChevronRight = (props) => <Icon {...props} path={<polyline points="9 18 15 12 9 6"/>} />;
        const ChevronLeft = (props) => <Icon {...props} path={<polyline points="15 18 9 12 15 6"/>} />;
        const ChevronDown = (props) => <Icon {...props} path={<polyline points="6 9 12 15 18 9"/>} />;
        const CheckCircle2 = (props) => <Icon {...props} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />;
        const MinusCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="8" x2="16" y1="12" y2="12"/></>} />;
        const UserPlus = (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="16" x2="22" y1="11" y2="11"/></>} />;
        const Plus = (props) => <Icon {...props} path={<><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>} />;
        const ClipboardList = (props) => <Icon {...props} path={<><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></>} />;
        const UploadCloud = (props) => <Icon {...props} path={<><path d="m16 13-4-4-4 4"/><path d="M12 9v9"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/><path d="M12 13v9"/></>} />;
        const Trash2 = (props) => <Icon {...props} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 2-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} />;
        const Users = (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />;
        const Search = (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></>} />;
        const BarChart3 = (props) => <Icon {...props} path={<><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>} />;
        const FileText = (props) => <Icon {...props} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></>} />;

        const firebaseConfig = {
          apiKey: "AIzaSyCLW7tZxGuecMGa7FgWuvGMcxi4x_5wD7w",
          authDomain: "north-champions-2026.firebaseapp.com",
          projectId: "north-champions-2026",
          storageBucket: "north-champions-2026.firebasestorage.app",
          messagingSenderId: "14904881173",
          appId: "1:14904881173:web:97937bc54d5d309155f81c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'north-champions-2026';
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbxbXEeV2VXXW8P6RD9riqkKtaMr2FedlRnWxn21rbd_ZuL88Wbec-elQyOcmOVAOEws/exec";

        const LOGO_URL = "./logo.png";

        const CRITERIA = [
            { id: 'creatividad', label: '1. Creatividad', max: 2, section: 'Desempeño' },
            { id: 'escenario', label: '2. Escenario, Espacio y Transiciones', max: 2, section: 'Desempeño' },
            { id: 'intensidad', label: '3. Intensidad, Proyección y Presencia', max: 2, section: 'Desempeño' },
            { id: 'imagen', label: '4. Imagen Urbana', max: 2, section: 'Desempeño' },
            { id: 'entretenimiento', label: '5. Entretenimiento / Atracción', max: 2, section: 'Desempeño' },
            { id: 'musicalidad', label: 'I. Musicalidad', max: 2, section: 'Habilidades' },
            { id: 'sincronizacion', label: 'II. Sincronización', max: 2, section: 'Habilidades' },
            { id: 'ejecucion', label: 'III. Ejecución', max: 2, section: 'Habilidades' },
            { id: 'dificultad', label: 'IV. Dificultad Estilos Urbanos', max: 2, section: 'Habilidades' },
            { id: 'variedad', label: 'V. Variedad de Estilo', max: 2, section: 'Habilidades' },
        ];

        const DEDUCTIONS_LIST = [
            { id: 'miembros_inicio', label: 'Miembros no en escenario al inicio', value: 1.00 },
            { id: 'caida_mayor', label: 'Caída grado mayor', value: 0.10 },
            { id: 'caida_menor', label: 'Caída grado menor', value: 0.05 },
            { id: 'reinicio', label: 'Reinicio de rutina', value: 1.00 },
            { id: 'fuera_tiempo', label: 'Duración fuera de tiempo', value: 1.00 },
            { id: 'lenguaje_inapropiado', label: 'Lenguaje inapropiado', value: 0.05 },
            { id: 'gestos_obscenos', label: 'Gestos obscenos', value: 0.10 },
            { id: 'vestimenta_inapropiada', label: 'Vestimenta inapropiada', value: 0.05 },
            { id: 'pinturas_confeti', label: 'Uso de pinturas/confeti', value: 1.00 },
            { id: 'accesorios_lanzados', label: 'Ropa/accesorios lanzados', value: 0.10 },
        ];

        const JURADOS = [
            { id: 'juez1', name: 'Jurado 1', pass: 'dance101' },
            { id: 'juez2', name: 'Jurado 2', pass: 'dance202' },
            { id: 'juez3', name: 'Jurado 3', pass: 'dance303' },
            { id: 'admin', name: 'Administrador', pass: 'master99' },
        ];

        const CATEGORIAS = [
            'Solista kids', 'Solista Juvenil', 'Pre Junior', 'Junior', 'Varsity', 'Adult', 'Mini Crew Kids', 'Mini Crew', 'Mega Kids', 'Mega Crew'
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [currentUserData, setCurrentUserData] = useState(null);
            const [password, setPassword] = useState('');
            const [view, setView] = useState('login'); 
            const [scores, setScores] = useState([]);
            const [participants, setParticipants] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selectedGroup, setSelectedGroup] = useState(null);
            const [formScores, setFormScores] = useState({}); 
            const [formDeductions, setFormDeductions] = useState({}); 
            const [message, setMessage] = useState(null);
            const [timerRemaining, setTimerRemaining] = useState(0);
            const [searchTerm, setSearchTerm] = useState('');
            const [newParticipantName, setNewParticipantName] = useState('');
            const [bulkList, setBulkList] = useState('');
            const [currentCategory, setCurrentCategory] = useState(CATEGORIAS[0]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [expandedCategories, setExpandedCategories] = useState({});

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth error:", err); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubScores = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'scores'), (snap) => {
                    setScores(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubParticipants = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'participants'), (snap) => {
                    setParticipants(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubScores(); unsubParticipants(); };
            }, [user]);

            const handleLogin = () => {
                const found = JURADOS.find(j => j.pass === password);
                if (found) {
                    setCurrentUserData(found);
                    setView(found.id === 'admin' ? 'admin' : 'categories');
                    setPassword('');
                    setMessage({ text: `Bienvenido, ${found.name}`, type: 'success' });
                    setTimeout(() => setMessage(null), 3000);
                } else { 
                    setMessage({ text: 'Contraseña incorrecta', type: 'error' });
                    setTimeout(() => setMessage(null), 3000);
                }
            };

            const toggleCategoryAccordion = (cat) => {
                setExpandedCategories(prev => ({ ...prev, [cat]: !prev[cat] }));
            };

            const getAverageScore = (groupId) => {
                const groupScores = scores.filter(s => s.participantId === groupId);
                if (groupScores.length === 0) return 0;
                const sum = groupScores.reduce((acc, curr) => acc + curr.total, 0);
                return parseFloat((sum / groupScores.length).toFixed(2));
            };

            // Función para exportar PDF individual del participante
            const exportParticipantPDF = (participant) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const partScores = scores.filter(s => s.participantId === participant.id);
                const avg = getAverageScore(participant.id);

                // Encabezado
                doc.setFillColor(15, 23, 42); // Slate-950
                doc.rect(0, 0, 210, 35, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(16);
                doc.text("NORTH CHAMPIONS 2026", 14, 18);
                doc.setFontSize(10);
                doc.setTextColor(129, 140, 248); // Indigo-400
                doc.text("REPORTE OFICIAL DE CALIFICACIÓN", 14, 26);

                // Datos del Participante
                doc.setTextColor(30, 41, 59);
                doc.setFontSize(14);
                doc.text(`Participante: ${participant.name.toUpperCase()}`, 14, 48);
                doc.setFontSize(11);
                doc.setTextColor(100, 116, 139);
                doc.text(`Categoría: ${participant.category}`, 14, 56);
                doc.text(`Promedio General: ${avg.toFixed(2)} pts`, 14, 64);
                doc.text(`Jueces que calificaron: ${partScores.length}`, 14, 72);

                let y = 85;
                if (partScores.length === 0) {
                    doc.setFontSize(12);
                    doc.setTextColor(150, 150, 150);
                    doc.text("Este participante aún no tiene calificaciones registradas.", 14, y);
                } else {
                    partScores.forEach((scoreObj, index) => {
                        if (y > 250) { doc.addPage(); y = 20; }
                        doc.setFillColor(241, 245, 249);
                        doc.roundedRect(14, y, 182, 12, 2, 2, 'F');
                        doc.setFont("Helvetica", "bold");
                        doc.setFontSize(10);
                        doc.setTextColor(15, 23, 42);
                        doc.text(`${scoreObj.jurorName.toUpperCase()} — Total Jurado: ${scoreObj.total.toFixed(2)}`, 18, y + 8);
                        y += 18;

                        doc.setFont("Helvetica", "normal");
                        doc.setFontSize(9);
                        
                        // Criterios
                        if (scoreObj.values) {
                            Object.keys(scoreObj.values).forEach(critKey => {
                                const critMeta = CRITERIA.find(c => c.id === critKey);
                                const label = critMeta ? critMeta.label : critKey;
                                const val = scoreObj.values[critKey];
                                if (y > 270) { doc.addPage(); y = 20; }
                                doc.text(`• ${label}: ${parseFloat(val || 0).toFixed(2)}`, 20, y);
                                y += 6;
                            });
                        }
                        y += 6;
                    });
                }

                doc.save(`NorthChampions_${participant.name.replace(/\s+/g, '_')}.pdf`);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-10">
                    <header className="bg-slate-950 text-white p-5 sticky top-0 z-50 shadow-xl flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            {LOGO_URL ? (
                                <img src={LOGO_URL} alt="Logo" className="h-10 w-auto object-contain" onError={(e) => e.target.style.display = 'none'} />
                            ) : (
                                <div className="bg-indigo-600 p-2 rounded-xl text-white"><Trophy size={20} /></div>
                            )}
                            <div className="flex flex-col">
                                <span className="font-black text-lg tracking-tighter leading-none">NORTH CHAMPIONS</span>
                                <span className="text-[10px] font-bold text-indigo-400 tracking-widest uppercase">Series 2026</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden sm:flex flex-col items-end">
                                <span className="text-[9px] font-black uppercase text-slate-500 leading-none mb-1">{currentUserData?.name}</span>
                                <span className="text-[8px] font-black text-green-500 flex items-center gap-1 uppercase tracking-tighter"><Cloud size={10}/> Sistema Online</span>
                            </div>
                            <button onClick={() => setView('login')} className="bg-slate-800 p-2.5 rounded-xl text-slate-400 hover:text-red-400 transition-colors"><LogOut size={20} /></button>
                        </div>
                    </header>

                    {message && (
                        <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-8 py-3 rounded-full shadow-2xl font-black text-[10px] animate-in ${message.type === 'error' ? 'bg-red-600 text-white' : 'bg-indigo-600 text-white'}`}>{message.text.toUpperCase()}</div>
                    )}

                    <main className="max-w-2xl mx-auto p-5">
                        {view === 'login' && (
                            <div className="min-h-[70vh] flex items-center justify-center">
                                <div className="w-full max-w-md bg-slate-900 rounded-[3rem] p-12 text-white shadow-2xl border border-slate-800 text-center animate-in">
                                    <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-lg rotate-3"><Trophy size={32} /></div>
                                    <h1 className="text-2xl font-black uppercase tracking-tighter mb-1">North Champions</h1>
                                    <p className="text-indigo-400 font-bold text-[10px] uppercase tracking-widest mb-12">Acceso de Personal</p>
                                    <input type="password" placeholder="Contraseña" className="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl p-5 mb-6 text-center text-2xl font-black outline-none focus:border-indigo-500 transition-all placeholder:text-slate-700" value={password} onChange={(e) => setPassword(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} />
                                    <button onClick={handleLogin} className="w-full bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl font-black text-lg active:scale-95 transition-all shadow-xl shadow-indigo-600/20 uppercase tracking-widest">INGRESAR</button>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-12 pb-20 animate-in">
                                <div className="bg-white p-8 rounded-[3rem] border border-slate-200 shadow-xl space-y-8">
                                    <div className="flex items-center gap-3 border-b border-slate-50 pb-4">
                                        <div className="bg-indigo-50 p-3 rounded-2xl text-indigo-600"><UserPlus size={24}/></div>
                                        <h3 className="text-xl font-black tracking-tight uppercase leading-none">Gestión de Competidores</h3>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="space-y-4">
                                            <h4 className="text-[10px] font-black uppercase text-indigo-500 tracking-widest flex items-center gap-2"><Plus size={14}/> Individual</h4>
                                            <div className="space-y-3">
                                                <input type="text" placeholder="Nombre" className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 font-bold outline-none focus:border-indigo-500 transition-all" value={newParticipantName} onChange={(e) => setNewParticipantName(e.target.value)} />
                                                <select className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 font-bold outline-none appearance-none cursor-pointer" value={currentCategory} onChange={(e) => setCurrentCategory(e.target.value)}>
                                                    {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                                <button onClick={async () => {
                                                    if (!newParticipantName.trim()) return;
                                                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'participants'), { name: newParticipantName.trim(), category: currentCategory, createdAt: Date.now() });
                                                    setNewParticipantName('');
                                                    setMessage({ text: 'Participante registrado', type: 'success' });
                                                    setTimeout(() => setMessage(null), 3000);
                                                }} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-indigo-600/10">Agregar</button>
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <h4 className="text-[10px] font-black uppercase text-indigo-500 tracking-widest flex items-center gap-2"><ClipboardList size={14}/> Carga Masiva</h4>
                                            <div className="space-y-3">
                                                <textarea placeholder="Un nombre por línea..." className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 font-bold outline-none h-[116px] resize-none text-xs" value={bulkList} onChange={(e) => setBulkList(e.target.value)} />
                                                <button onClick={async () => {
                                                    if (!bulkList.trim()) return;
                                                    const names = bulkList.split('\n').map(n => n.trim()).filter(n => n.length > 0);
                                                    const batch = writeBatch(db);
                                                    names.forEach(name => {
                                                        const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'participants'));
                                                        batch.set(newRef, { name, category: currentCategory, createdAt: Date.now() });
                                                    });
                                                    await batch.commit();
                                                    setBulkList('');
                                                    setMessage({ text: `${names.length} sincronizados`, type: 'success' });
                                                    setTimeout(() => setMessage(null), 3000);
                                                }} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest active:scale-95 flex items-center justify-center gap-2">
                                                    <UploadCloud size={18}/> PROCESAR
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-6 border-t border-slate-50 pt-6">
                                        <h4 className="text-[10px] font-black uppercase text-slate-400 mb-4 px-2 tracking-widest">Base de Datos ({participants.length})</h4>
                                        <div className="max-h-60 overflow-y-auto space-y-2 pr-2">
                                            {participants.sort((a,b) => b.createdAt - a.createdAt).map(p => (
                                                <div key={p.id} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                    <div><div className="font-bold text-slate-800 leading-none mb-1">{p.name}</div><div className="text-[9px] font-black text-indigo-500 uppercase tracking-tighter">{p.category}</div></div>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => exportParticipantPDF(p)} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 p-2 rounded-xl text-xs font-black uppercase flex items-center gap-1 transition-colors"><FileText size={14}/> PDF</button>
                                                        <button onClick={async () => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', p.id))} className="text-slate-300 hover:text-red-600 transition-colors p-2"><Trash2 size={18} /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Podio General & Ranking Completo Desplegable */}
                                <div className="space-y-8 pb-10">
                                    <h2 className="text-4xl font-black tracking-tighter flex items-center gap-4 border-b border-slate-200 pb-8 px-2 uppercase leading-none">
                                        <BarChart3 className="text-indigo-600" size={40} /> Podio y Ranking Completo
                                    </h2>
                                    {CATEGORIAS.map(cat => {
                                        const catParticipants = participants.filter(p => p.category === cat);
                                        if (catParticipants.length === 0) return null;
                                        
                                        // Ordenados de mayor a menor promedio
                                        const rankedAll = catParticipants.map(p => ({ ...p, avg: getAverageScore(p.id) })).sort((a, b) => b.avg - a.avg);
                                        const top3 = rankedAll.slice(0, 3);
                                        const rest = rankedAll.slice(3);
                                        const isExpanded = expandedCategories[cat];

                                        return (
                                            <div key={cat} className="space-y-5 bg-white p-8 rounded-[3rem] border border-slate-200 shadow-xl animate-in">
                                                <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                                                    <h3 className="text-xs font-black text-indigo-600 uppercase tracking-[0.3em]">{cat}</h3>
                                                    <span className="text-[10px] font-bold text-slate-400">{catParticipants.length} Competidores</span>
                                                </div>

                                                <div className="space-y-4">
                                                    {top3.map((p, idx) => (
                                                        <div key={p.id} className="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 flex items-center gap-5">
                                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black text-xl text-white shadow-md ${idx === 0 ? 'bg-amber-400' : idx === 1 ? 'bg-slate-400' : 'bg-amber-700'}`}>
                                                                {idx + 1}
                                                            </div>
                                                            <div className="flex-1">
                                                                <div className="font-black text-xl text-slate-800 uppercase leading-tight mb-1">{p.name}</div>
                                                                <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{scores.filter(s => s.participantId === p.id).length} Jurados calificados</div>
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                <div className="text-right bg-white px-5 py-2.5 rounded-2xl border border-slate-200">
                                                                    <div className="text-2xl font-black text-indigo-600 leading-none mb-1 tabular-nums">{p.avg.toFixed(2)}</div>
                                                                    <div className="text-[8px] font-black text-slate-400 uppercase tracking-widest leading-none">Promedio</div>
                                                                </div>
                                                                <button onClick={() => exportParticipantPDF(p)} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 p-3 rounded-2xl font-black transition-colors" title="Exportar PDF"><FileText size={18}/></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Desplegable para el resto del ranking */}
                                                {rest.length > 0 && (
                                                    <div className="pt-2">
                                                        <button 
                                                            onClick={() => toggleCategoryAccordion(cat)}
                                                            className="w-full bg-slate-900 hover:bg-slate-800 text-white py-4 px-6 rounded-2xl font-black text-xs uppercase tracking-widest flex justify-between items-center transition-all shadow-md"
                                                        >
                                                            <span>{isExpanded ? 'Ocultar resto del ranking' : `Ver ${rest.length} competidores siguientes en el ranking`}</span>
                                                            <ChevronDown className={`transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} size={16} />
                                                        </button>

                                                        {isExpanded && (
                                                            <div className="mt-4 space-y-3 pt-2 animate-in">
                                                                {rest.map((p, rIdx) => (
                                                                    <div key={p.id} className="bg-slate-50/70 p-5 rounded-2xl border border-slate-100 flex items-center justify-between">
                                                                        <div className="flex items-center gap-4">
                                                                            <span className="font-mono font-black text-slate-400 text-sm">#{rIdx + 4}</span>
                                                                            <div>
                                                                                <div className="font-bold text-slate-800 uppercase text-sm leading-none mb-1">{p.name}</div>
                                                                                <div className="text-[9px] text-slate-400 uppercase tracking-wider">{scores.filter(s => s.participantId === p.id).length} jueces</div>
                                                                            </div>
                                                                        </div>
                                                                        <div className="flex items-center gap-3">
                                                                            <span className="font-black text-indigo-600 text-lg tabular-nums">{p.avg.toFixed(2)}</span>
                                                                            <button onClick={() => exportParticipantPDF(p)} className="bg-white text-indigo-600 hover:bg-indigo-50 p-2.5 rounded-xl border border-slate-200 transition-colors" title="Exportar PDF"><FileText size={16}/></button>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
