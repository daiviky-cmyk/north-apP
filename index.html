                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'admin' && !selectedParticipantForPDF && (
                            <div className="bg-red-50 border-2 border-red-200 rounded-[2.5rem] p-6 sm:p-8 shadow-sm">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                                    <div className="flex items-start gap-4">
                                        <div className="bg-red-100 text-red-600 p-3 rounded-2xl shrink-0"><Trash2 size={24}/></div>
                                        <div>
                                            <h3 className="text-base font-black text-red-700 uppercase tracking-tight">Limpieza total de la aplicación</h3>
                                            <p className="text-xs font-bold text-red-500/80 mt-1 leading-relaxed">Elimina todos los competidores y todas las calificaciones guardadas en Firebase. Esta acción no se puede deshacer.</p>
                                        </div>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => { setCleanupCode(''); setShowCleanupModal(true); }}
                                        className="bg-red-600 hover:bg-red-700 text-white px-5 py-3.5 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-red-600/20 active:scale-95 transition-all shrink-0"
                                    >
                                        <Trash2 size={16}/> BORRAR TODO
                                    </button>
                                </div>
                            </div>
                        )}

                        {showCleanupModal && view === 'admin' && (
                            <div className="fixed inset-0 z-[200] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl border border-red-200 overflow-hidden animate-in">
                                    <div className="bg-red-600 text-white p-6">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-white/15 p-2.5 rounded-xl"><Trash2 size={22}/></div>
                                            <div>
                                                <h3 className="font-black uppercase tracking-tight text-lg">Confirmar limpieza total</h3>
                                                <p className="text-[10px] font-bold uppercase tracking-widest text-red-100 mt-1">Acción irreversible</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="p-6 space-y-5">
                                        <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-xs font-bold text-red-700 leading-relaxed">
                                            Se eliminarán <strong>todos los competidores y todas las calificaciones</strong> de la aplicación. No se borrará la configuración del sistema.
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Ingrese el código de seguridad</label>
                                            <input
                                                type="password"
                                                autoFocus
                                                value={cleanupCode}
                                                onChange={(e) => setCleanupCode(e.target.value)}
                                                onKeyDown={(e) => { if (e.key === 'Enter') cleanEntireApp(); }}
                                                placeholder="Código de limpieza"
                                                className="w-full bg-slate-50 border-2 border-slate-200 focus:border-red-500 rounded-xl p-4 font-black tracking-widest outline-none text-center"
                                            />
                                            <p className="text-[9px] text-slate-400 font-bold mt-2 text-center">Se requiere el código exacto para continuar.</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button
                                                type="button"
                                                disabled={isCleaning}
                                                onClick={() => { setShowCleanupModal(false); setCleanupCode(''); }}
                                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"
                                            >
                                                CANCELAR
                                            </button>
                                            <button
                                                type="button"
                                                disabled={isCleaning || cleanupCode !== MASTER_CLEANUP_CODE}
                                                onClick={cleanEntireApp}
                                                className="bg-red-600 hover:bg-red-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 transition-all"
                                            >
                                                <Trash2 size={15}/> {isCleaning ? 'BORRANDO...' : 'CONFIRMAR'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && selectedParticipantForPDF && (
                            <div className="space-y-5 animate-in pb-20">
                                <div className="flex items-center justify-between bg-white px-5 py-3.5 rounded-2xl border border-slate-200 shadow-sm">
                                    <button onClick={() => setSelectedParticipantForPDF(null)} className="flex items-center gap-1.5 text-indigo-600 font-black text-xs uppercase tracking-widest hover:text-indigo-800 transition-colors">
                                        <ChevronLeft size={16} /> Volver
                                    </button>
                                    <button 
                                        onClick={() => downloadPDFFile(selectedParticipantForPDF)} 
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 active:scale-95 transition-all"
                                    >
                                        <Download size={14} /> Guardar PDF
                                    </button>
                                </div>

                                <div className="bg-white p-6 sm:p-8 rounded-[2.5rem] border border-slate-200 shadow-xl space-y-6">
                                    <div className="border-b border-slate-100 pb-5">
                                        <div className="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-1">{selectedParticipantForPDF.category}</div>
                                        <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight uppercase">{selectedParticipantForPDF.name}</h2>
                                        <p className="text-xs font-bold text-slate-500 mt-1">Cantidad de Integrantes: <span className="text-indigo-600 font-black text-sm">{selectedParticipantForPDF.memberCount || 1}</span></p>
                                        <p className="text-xs font-bold text-slate-500 mt-0.5">Suma Total Acumulada: <span className="text-indigo-600 font-black text-base">{getTotalScoreSum(selectedParticipantForPDF.id).toFixed(2)} pts</span></p>
                                    </div>

                                    <div className="space-y-6">
                                        {scores.filter(s => s.participantId === selectedParticipantForPDF.id).length === 0 ? (
                                            <div className="p-10 text-center text-slate-400 font-bold uppercase text-xs">Este participante aún no tiene calificaciones registradas.</div>
                                        ) : (
                                            scores.filter(s => s.participantId === selectedParticipantForPDF.id).map(scoreObj => (
                                                <div key={scoreObj.id} className="bg-slate-50 p-5 rounded-3xl border border-slate-100 space-y-4">
                                                    <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                                        <span className="font-black text-slate-800 uppercase text-sm">{scoreObj.jurorName}</span>
                                                        <span className="font-black text-indigo-600 text-base">Subtotal: {scoreObj.total.toFixed(2)}</span>
                                                    </div>

                                                    <div className="space-y-3">
                                                        <span className="text-[10px] font-black uppercase text-indigo-600 tracking-wider block">Desempeño:</span>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {['creatividad', 'escenario', 'intensidad', 'imagen', 'entretenimiento'].map(critKey => {
                                                                const critMeta = CRITERIA.find(c => c.id === critKey);
                                                                const fullLabel = critMeta ? critMeta.label : critKey;
                                                                const val = scoreObj.values?.[critKey];
                                                                return (
                                                                    <div key={critKey} className="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                                                        <span className="font-bold text-slate-700 pr-2">{fullLabel}</span>
                                                                        <span className="font-black text-indigo-600">{parseFloat(val || 0).toFixed(2)}</span>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>

                                                    <div className="space-y-3 pt-1">
                                                        <span className="text-[10px] font-black uppercase text-indigo-600 tracking-wider block">Habilidades:</span>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {['musicalidad', 'sincronizacion', 'ejecucion', 'dificultad', 'variedad'].map(critKey => {
                                                                const critMeta = CRITERIA.find(c => c.id === critKey);
                                                                const fullLabel = critMeta ? critMeta.label : critKey;
                                                                const val = scoreObj.values?.[critKey];
                                                                return (
                                                                    <div key={critKey} className="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                                                        <span className="font-bold text-slate-700 pr-2">{fullLabel}</span>
                                                                        <span className="font-black text-indigo-600">{parseFloat(val || 0).toFixed(2)}</span>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>

                                                    <div className="space-y-2 pt-1">
                                                        <span className="text-[10px] font-black uppercase text-red-500 tracking-wider block">Penalizaciones Aplicadas:</span>
                                                        <div className="space-y-1">
                                                            {scoreObj.deductions && Object.keys(scoreObj.deductions).filter(k => scoreObj.deductions[k]).length > 0 ? (
                                                                Object.keys(scoreObj.deductions).filter(k => scoreObj.deductions[k]).map(dedId => {
                                                                    const dedMeta = DEDUCTIONS_LIST.find(d => d.id === dedId);
                                                                    const dedLabel = dedMeta ? dedMeta.label : dedId;
                                                                    const dedVal = dedMeta ? dedMeta.value : 0;
                                                                    return (
                                                                        <div key={dedId} className="bg-red-50/70 p-2.5 rounded-xl border border-red-100 flex justify-between items-center text-xs">
                                                                            <span className="font-bold text-red-700">{dedLabel}</span>
                                                                            <span className="font-black text-red-600">-{dedVal.toFixed(2)}</span>
                                                                        </div>
                                                                    );
                                                                })
                                                            ) : (
                                                                <div className="text-slate-400 text-xs italic">Ninguna penalización registrada.</div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
